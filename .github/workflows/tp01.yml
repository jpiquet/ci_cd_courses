# TODO: Complétez ce workflow
#
# Objectif : Créer un pipeline CI qui :
# 1. Se déclenche sur push vers main ET sur pull_request
# 2. Récupère le code
# 3. Installe Python 3.11
# 4. Installe les dépendances
# 5. Lance les tests pytest

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions minimales (bonne pratique sécurité)
permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      
      - name: Install python
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b
        with:
          python-version: '3.11'
          cache: 'pip'

      # Afficher tout l'événement (utile pour le debug)
      - name: Debug - Voir l'événement complet
        run: echo '${{ toJSON(github.event) }}'

      # Pour un push : accéder aux commits
      - name: Liste des commits (sur un push)
        run: echo '${{ toJSON(github.event.commits) }}'

